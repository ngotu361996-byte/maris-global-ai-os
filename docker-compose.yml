# Development only. Do not use these passwords anywhere else.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: maris
      POSTGRES_PASSWORD: maris_dev
      POSTGRES_DB: maris
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres-init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maris -d maris"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: maris
      MINIO_ROOT_PASSWORD: maris_dev_minio
    ports: ["9000:9000", "9001:9001"]
    volumes:
      - miniodata:/data
volumes:
  pgdata:
  miniodata:
