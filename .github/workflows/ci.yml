name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: maris
          POSTGRES_PASSWORD: maris_dev
          POSTGRES_DB: maris
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U maris -d maris" --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
    env:
      DATABASE_ADMIN_URL: postgres://maris:maris_dev@localhost:5432/maris
      DATABASE_URL: postgres://maris_app:maris_app_dev@localhost:5432/maris
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create runtime database role
        run: psql postgres://maris:maris_dev@localhost:5432/maris -f infra/postgres-init.sql
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm db:migrate
      - name: Test (encryption keys generated per run)
        run: |
          export MFA_ENCRYPTION_KEY=$(node -e "console.log(require('crypto').randomBytes(32).toString('base64'))")
          export VAULT_MASTER_KEY=$(node -e "console.log(require('crypto').randomBytes(32).toString('base64'))")
          pnpm test
      - name: Dependency audit (high and critical)
        run: pnpm audit --audit-level high
